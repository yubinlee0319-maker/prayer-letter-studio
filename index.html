<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기도편지 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#e4f0fc;
    --bg2:#fbeedc;
    --surface:#ffffff;
    --surface-2:#f1f8fd;
    --ink:#152437;
    --ink-dim:#516175;
    --ink-faint:#8394a8;
    --line:#cfe2f4;
    --line-soft:#e2eefa;
    --accent:#1f7fe0;
    --accent2:#f2a238;
    --accent-strong:#1259a8;
    --accent-soft:#dceafd;
    --verse:#e0553a;
    --verse-soft:#fde7df;
    --good:#16a870;
    --good-soft:#dcf6ea;
    --danger:#e0473a;
    --shadow: 0 1px 2px rgba(18,60,110,.08), 0 10px 26px -12px rgba(18,60,110,.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1826;
      --bg2:#1c1710;
      --surface:#152030;
      --surface-2:#1a2740;
      --ink:#eaf1fb;
      --ink-dim:#9ab0c9;
      --ink-faint:#6d84a0;
      --line:#25415f;
      --line-soft:#1c3049;
      --accent:#5aa6ef;
      --accent2:#f5b45a;
      --accent-strong:#93c7f7;
      --accent-soft:#1d3a5c;
      --verse:#ff9376;
      --verse-soft:#3a2318;
      --good:#3fd694;
      --good-soft:#123626;
      --danger:#ff8a76;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1826;
    --bg2:#1c1710;
    --surface:#152030;
    --surface-2:#1a2740;
    --ink:#eaf1fb;
    --ink-dim:#9ab0c9;
    --ink-faint:#6d84a0;
    --line:#25415f;
    --line-soft:#1c3049;
    --accent:#5aa6ef;
    --accent2:#f5b45a;
    --accent-strong:#93c7f7;
    --accent-soft:#1d3a5c;
    --verse:#ff9376;
    --verse-soft:#3a2318;
    --good:#3fd694;
    --good-soft:#123626;
    --danger:#ff8a76;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 30px -14px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(1100px 520px at 6% -8%, var(--accent-soft), transparent 60%),
      radial-gradient(900px 460px at 108% 0%, var(--bg2), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  ::selection{ background: var(--accent-soft); }
  button{ font-family:inherit; }
  textarea, input{ font-family:inherit; }
  h1,h2,h3,h4{ text-wrap: balance; margin:0; }

  .app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; gap:20px;
    padding:14px 22px; background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(155deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:16px; flex:none;
    box-shadow: var(--shadow);
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-size:15.5px; font-weight:800; letter-spacing:-.01em; }
  .brand-text span{ font-size:11.5px; color:var(--ink-dim); }

  .tabs{ display:flex; gap:4px; margin-left:8px; }
  .tab-btn{
    border:none; background:transparent; color:var(--ink-dim);
    font-size:14px; font-weight:600; padding:9px 14px; border-radius:9px;
    cursor:pointer; transition: background .15s, color .15s;
  }
  .tab-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .tab-btn.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .tab-btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .topbar-spacer{ flex:1; }
  .save-status{ font-size:12px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; }
  .save-dot{ width:6px; height:6px; border-radius:50%; background:var(--good); }

  /* ---------- layout ---------- */
  .view{ flex:1; padding:24px; max-width:1360px; width:100%; margin:0 auto; }
  .compose-grid{
    display:grid; grid-template-columns: minmax(340px, 440px) 1fr;
    gap:22px; align-items:start;
  }
  @media (max-width: 920px){
    .compose-grid{ grid-template-columns: 1fr; }
  }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:14px;
    box-shadow: var(--shadow);
  }
  .panel:nth-of-type(2n){ border-top-color: var(--accent2); }
  .panel + .panel{ margin-top:16px; }
  .panel-head{
    padding:14px 18px; border-bottom:1px solid var(--line-soft);
    display:flex; align-items:center; gap:10px;
  }
  .panel-head h3{ font-size:14px; font-weight:800; }
  .panel-head .hint{ font-size:12px; color:var(--ink-faint); }
  .panel-body{ padding:16px 18px; }

  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block; font-size:12.5px; font-weight:700; color:var(--ink-dim);
    margin-bottom:6px;
  }
  .field .sub{ font-weight:500; color:var(--ink-faint); }
  .field input[type=text], .field textarea, .field select{
    width:100%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); border-radius:9px; padding:9px 11px; font-size:14px;
    line-height:1.55; resize:vertical;
  }
  .field input[type=text]:focus, .field textarea:focus, .field select:focus{
    border-color:var(--accent); outline:none;
  }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  .btn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    font-size:13px; font-weight:700; padding:8px 13px; border-radius:9px;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition: filter .12s, background .12s;
  }
  .btn:hover{ filter:brightness(0.97); }
  :root[data-theme="dark"] .btn:hover, @media (prefers-color-scheme: dark){ .btn:hover{ filter:brightness(1.15);} }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ background:transparent; }
  .btn.danger{ color:var(--danger); border-color:var(--danger); background:transparent; }
  .btn.small{ padding:5px 9px; font-size:12px; border-radius:7px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  /* photo picker */
  .photo-list{ display:flex; flex-direction:column; gap:10px; }
  .photo-row{ display:flex; gap:10px; align-items:flex-start; padding:8px; border:1px solid var(--line-soft); border-radius:10px; background:var(--surface-2); }
  .photo-thumb{ width:64px; height:64px; border-radius:8px; object-fit:cover; flex:none; border:1px solid var(--line); background:var(--bg); }
  .photo-row .field{ flex:1; margin:0; }
  .photo-row input[type=text]{ padding:7px 9px; font-size:13px; }
  .upload-drop{
    border:1.5px dashed var(--line); border-radius:10px; padding:16px;
    text-align:center; color:var(--ink-faint); font-size:12.5px; cursor:pointer;
    background:var(--surface-2);
  }
  .upload-drop:hover{ border-color:var(--accent); color:var(--accent-strong); }

  /* sections */
  .section-block{ border:1px solid var(--line-soft); border-radius:10px; padding:12px; background:var(--surface-2); margin-bottom:12px; }
  .section-block:last-child{ margin-bottom:0; }
  .section-block-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .section-block-head input[type=text]{ font-weight:700; }
  .sec-photos{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .sec-photo-thumb{ position:relative; width:56px; height:56px; border-radius:8px; overflow:hidden; border:1px solid var(--line); flex:none; }
  .sec-photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .sec-photo-thumb .rm{ position:absolute; top:0; right:0; width:18px; height:18px; border:none; background:rgba(20,25,35,.65); color:#fff; font-size:11px; line-height:18px; cursor:pointer; border-radius:0 0 0 6px; padding:0; }
  .sec-photo-add{ width:56px; height:56px; border-radius:8px; border:1.5px dashed var(--line); flex:none; display:flex; align-items:center; justify-content:center; font-size:11.5px; color:var(--ink-faint); cursor:pointer; text-align:center; }
  .sec-photo-add:hover{ border-color:var(--accent); color:var(--accent-strong); }

  /* ---------- preview (paper) ---------- */
  .preview-wrap{ position:sticky; top:74px; }
  .preview-actions{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .status-pill{
    font-size:12px; font-weight:700; padding:5px 10px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent-strong); cursor:pointer; border:none;
  }
  .status-pill.ready{ background:var(--good-soft); color:var(--good); }

  .paper-scroll{ overflow-x:auto; padding:4px; }
  .paper{
    width:420px; max-width:100%; margin:0 auto; background:#f4f7fd; color:#1a2230;
    border-radius:26px; box-shadow: var(--shadow);
    padding:16px; font-family:'Noto Sans KR', sans-serif;
    display:flex; flex-direction:column; gap:16px;
  }
  .paper .hero{
    position:relative; border-radius:20px; overflow:hidden; min-height:270px;
    display:flex; flex-direction:column; justify-content:flex-end; padding:22px 20px;
    background:linear-gradient(150deg,#2f7dd1,#f2a238);
  }
  .paper .hero img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .paper .hero .scrim{ position:absolute; inset:0; background:linear-gradient(0deg, rgba(10,16,26,.72) 0%, rgba(10,16,26,.15) 55%, rgba(10,16,26,.05) 100%); z-index:1; }
  .paper .hero .hero-inner{ position:relative; z-index:2; }
  .paper .hero .hero-eyebrow{ font-size:11.5px; font-weight:700; letter-spacing:.08em; color:rgba(255,255,255,.85); text-transform:uppercase; margin-bottom:6px; }
  .paper .hero .hero-title{ font-family:'Noto Serif KR', serif; font-size:29px; font-weight:700; color:#fff; line-height:1.28; text-shadow:0 2px 14px rgba(0,0,0,.35); }
  .paper .hero .hero-sub{ font-size:13px; color:rgba(255,255,255,.88); margin-top:8px; font-weight:500; }

  .paper .collage{ display:grid; grid-template-columns:1fr 1fr; gap:6px; border-radius:18px; overflow:hidden; }
  .paper .collage img{ width:100%; height:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#e4ecf7; }

  .paper .verse-card{
    background:#fdf1de; border-radius:20px; padding:24px 20px; text-align:center;
  }
  .paper .verse-card .icon{ font-size:26px; margin-bottom:8px; }
  .paper .verse-card .verse-ref{ display:inline-block; font-size:11.5px; font-weight:800; color:#b5651d; background:#ffffffb0; padding:4px 12px; border-radius:999px; margin-bottom:10px; }
  .paper .verse-card .verse-text{ font-family:'Noto Serif KR', serif; font-style:italic; font-size:15px; color:#7a4a12; line-height:1.7; }

  .paper .intro{ padding:2px 6px; }
  .paper .intro p{ font-family:'Noto Serif KR', serif; font-size:14.5px; line-height:1.85; text-align:justify; color:#2a3446; margin:0 0 12px; }
  .paper .intro p:last-child{ margin-bottom:0; }

  .paper .section-card{ border-radius:20px; padding:22px 18px; text-align:center; }
  .paper .section-card .badge{ display:inline-flex; align-items:center; justify-content:center; min-width:40px; padding:4px 12px; border-radius:999px; color:#fff; font-size:12px; font-weight:800; letter-spacing:.03em; margin-bottom:10px; }
  .paper .section-card h4{ font-size:17px; font-weight:800; color:#182335; margin-bottom:14px; }
  .paper .section-card .items{ text-align:left; }
  .paper .section-card .item{ display:flex; gap:10px; align-items:flex-start; padding:10px 2px; border-bottom:1px dashed rgba(20,30,50,.14); }
  .paper .section-card .item:last-child{ border-bottom:none; padding-bottom:2px; }
  .paper .section-card .item:first-child{ padding-top:0; }
  .paper .section-card .num{ flex:none; width:22px; height:22px; border-radius:50%; color:#fff; font-size:11.5px; font-weight:800; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .paper .section-card .item span.txt{ font-size:13.5px; line-height:1.65; color:#28324a; text-align:left; }

  .paper .footer{ text-align:center; font-weight:700; font-size:12.5px; color:#7c8aa0; padding:4px 6px 2px; }

  /* ---------- recipients / archive ---------- */
  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar .count{ font-size:13px; color:var(--ink-dim); margin-left:auto; }
  .add-recipient-form{ display:flex; gap:8px; flex-wrap:wrap; }
  .add-recipient-form input{ flex:1; min-width:140px; }

  table.rlist{ width:100%; border-collapse:collapse; font-size:14px; }
  table.rlist th{ text-align:left; font-size:11.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.rlist td{ padding:9px 10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  table.rlist tr:last-child td{ border-bottom:none; }
  table.rlist input[type=text]{ border:1px solid transparent; background:transparent; padding:5px 7px; border-radius:6px; width:100%; font-size:14px; color:var(--ink); }
  table.rlist input[type=text]:hover{ border-color:var(--line); }
  table.rlist input[type=text]:focus{ border-color:var(--accent); background:var(--surface-2); outline:none; }
  .switch{ position:relative; width:36px; height:20px; border-radius:999px; background:var(--line); border:none; cursor:pointer; flex:none; }
  .switch.on{ background:var(--good); }
  .switch::after{ content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; box-shadow:0 1px 2px rgba(0,0,0,.25); }
  .switch.on::after{ transform:translateX(16px); }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:13.5px; }
  .empty-state .big{ font-size:28px; margin-bottom:6px; }

  .archive-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .archive-card{
    border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:14px;
    cursor:pointer; transition: border-color .12s, transform .12s; box-shadow:var(--shadow);
  }
  .archive-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .archive-card .ttl{ font-weight:800; font-size:14.5px; margin-bottom:4px; }
  .archive-card .meta{ font-size:12px; color:var(--ink-faint); margin-bottom:10px; }
  .archive-card .badge{ display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent-strong); }
  .archive-card .badge.ready{ background:var(--good-soft); color:var(--good); }
  .archive-card .sendprog{ font-size:12px; color:var(--ink-dim); margin-top:8px; }

  .detail-back{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .checklist{ display:flex; flex-direction:column; gap:2px; max-height:360px; overflow-y:auto; padding-right:4px; }
  .check-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; }
  .check-row:hover{ background:var(--surface-2); }
  .check-row input[type=checkbox]{ width:17px; height:17px; accent-color:var(--good); flex:none; }
  .check-row .nm{ font-size:14px; }
  .check-row .memo{ font-size:12px; color:var(--ink-faint); margin-left:auto; }
  .check-row.sent .nm{ color:var(--ink-faint); text-decoration:line-through; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(0);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:100;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  .footer-note{ text-align:center; font-size:12px; color:var(--ink-faint); padding:24px 0 10px; }
  .footer-note a{ color:var(--accent); cursor:pointer; text-decoration:underline; }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>

</head>
<body>

<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

  function scheduleSave(){
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persist, 350);

  function syncToServer(){
    if (BACKEND_AVAILABLE === false) return;
    fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ letters: state.letters, recipients: state.recipients })
    }).then(function(r){
      BACKEND_AVAILABLE = !!(r && r.ok);
      renderSaveStatus();
    }).catch(function(){
      BACKEND_AVAILABLE = false;
      renderSaveStatus();
    });
  }

  function initBackendSync(){
    fetch('/api/sync').then(function(r){
      if (!r.ok) throw new Error('no backend');
      return r.json();
    }).then(function(data){
      BACKEND_AVAILABLE = true;
      var serverLetters = (data && Array.isArray(data.letters)) ? data.letters : [];
      var serverRecipients = (data && Array.isArray(data.recipients)) ? data.recipients : [];
      if (serverLetters.length || serverRecipients.length){
        if (serverLetters.length) state.letters = serverLetters;
        state.recipients = serverRecipients;
        if (!getLetter(state.currentId)) state.currentId = sortedLetters()[0].id;
        try {
          localStorage.setItem(LKEY, JSON.stringify(state.letters));
          localStorage.setItem(RKEY, JSON.stringify(state.recipients));
        } catch(e){}
        render();
      } else {
        /* fresh/empty database: seed it with what we have locally */
        syncToServer();
      }
      renderSaveStatus();
    }).catch(function(){
      BACKEND_AVAILABLE = false;
      renderSaveStatus();
    });
  }

  /* ---------------- image compression ---------------- */
  function fileToCompressedDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('read-failed')); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error('decode-failed')); };
        img.onload = function(){
          var maxW = 900;
          var scale = Math.min(1, maxW / img.width);
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  /* ---------------- mutations ---------------- */

    if (!state.letters.length) state.letters.push(blankLetter());

    Promise.all(files.map(function(f){
      return fileToCompressedDataUrl(f).catch(function(){ return null; });
    })).then(function(urls){
      urls.forEach(function(url){
        if (!url) return;
        letter.photos = [{ id: uid(), caption: '', dataUrl: url }];

      touch(letter);
      scheduleSave();
      renderCompose();

  function addSectionPhotos(sectionId, fileList){

      urls.forEach(function(url){

  /* ---------------- text export ---------------- */
  function buildPlainText(letter){
    var lines = [];
    if (letter.subtitle) lines.push(letter.subtitle);
    lines.push(letter.title);
    lines.push('');
    if (letter.verseText){
      if (letter.verseRef) lines.push('[' + letter.verseRef + ']');
      lines.push('"' + letter.verseText + '"');
      lines.push('');
    }
    if (letter.intro){
      lines.push(letter.intro.trim());
      lines.push('');
    }
    letter.sections.forEach(function(s){
      var bodyLines = (s.body||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if (!s.heading && !bodyLines.length) return;
      lines.push('■ ' + s.heading);
      bodyLines.forEach(function(l){ lines.push(l); });
      lines.push('');
    });
    if (letter.footerText) lines.push(letter.footerText);
    var photoCount = (letter.photos||[]).length + letter.sections.reduce(function(sum, s){ return sum + (s.photos||[]).length; }, 0);
    if (photoCount) lines.push('\n(사진 ' + photoCount + '장을 함께 첨부해서 보내주세요)');
    return lines.join('\n').trim();
  }
  function copyText(){
    var letter = currentLetter();
    var txt = buildPlainText(letter);
    var done = function(){ toast('본문을 복사했어요. 카카오톡에 붙여넣으세요.'); };
    var fail = function(){
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){ toast('복사에 실패했어요. 직접 선택해서 복사해주세요.'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(fail);
    } else fail();
  }

  function dateStamp(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* Works both inside the Claude Artifact viewer (uses the downloads
     capability, which asks the viewer to confirm) and as a plain
     standalone page (falls back to a normal browser download). */
  async function saveFile(filename, data){
    var hasClaudeRuntime = (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function');
    if (hasClaudeRuntime){
      var downloads = await window.claude.use('downloads');
      if (downloads){
        await downloads.save({ filename: filename, data: data });
        return;
      }
    }
    var blob = (data instanceof Blob) ? data : new Blob([data], { type: 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  async function exportImage(){
    var node = document.getElementById('paperNode');
    if (!node || typeof html2canvas === 'undefined'){ toast('이미지 변환 라이브러리를 불러오지 못했어요.'); return; }
    toast('이미지를 만들고 있어요…');
    try {
      var canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      canvas.toBlob(async function(blob){
        if (!blob){ toast('이미지 생성에 실패했어요.'); return; }
        try {
          await saveFile('기도편지_' + dateStamp() + '.png', blob);
          toast('이미지를 저장했어요. 카카오톡으로 보내보세요!');
        } catch(e){
          if (e && e.code === 'declined') return;
          toast('저장에 실패했어요: ' + ((e && e.message) || e));
        }
      }, 'image/png');
    } catch(e){
      toast('이미지 생성 중 문제가 발생했어요.');
    }
  }

  async function exportPDF(){
    var node = document.getElementById('paperNode');
    if (!node || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){ toast('PDF 변환 라이브러리를 불러오지 못했어요.'); return; }
    toast('PDF를 만들고 있어요…');
    try {
      var canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      var imgData = canvas.toDataURL('image/jpeg', 0.93);
      var pdf = new window.jspdf.jsPDF({
        orientation: canvas.height >= canvas.width ? 'portrait' : 'landscape',
        unit: 'px',
        format: [canvas.width, canvas.height]
      });
      pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
      var blob = pdf.output('blob');
      try {
        await saveFile('기도편지_' + dateStamp() + '.pdf', blob);
        toast('PDF를 저장했어요.');
      } catch(e){
        if (e && e.code === 'declined') return;
        toast('저장에 실패했어요: ' + ((e && e.message) || e));
      }
    } catch(e){
      toast('PDF 생성 중 문제가 발생했어요.');
    }
  }

  function importBackup(file){

      try {

        if (!data || !Array.isArray(data.letters)) throw new Error('bad');

  function renderSaveStatus(){
    var el = document.getElementById('saveStatus');
    if (!el) return;
    if (!saveOk){
      el.innerHTML = '<span class="save-dot" style="background:var(--danger)"></span> 저장 실패 — 공간을 확인해주세요';
    } else if (BACKEND_AVAILABLE === true){
      el.innerHTML = '<span class="save-dot"></span> 서버에 저장됨 · 다른 기기에서도 이어서 볼 수 있어요';
    } else {
      el.innerHTML = '<span class="save-dot"></span> 이 브라우저에 자동 저장됨';
    }
  }

  /* ---------- compose ---------- */
  function renderCompose(){
    var viewRoot = document.getElementById('viewRoot');
    if (!viewRoot) return;
    viewRoot.innerHTML = composeTemplate();
    bindComposeEvents();
    renderPreview();
  }

  function composeTemplate(){
    var letter = currentLetter();
    var options = sortedLetters().map(function(l){
      return '<option value="' + l.id + '"' + (l.id===letter.id?' selected':'') + '>' +
        esc(l.title || '(제목 없음)') + ' · ' + fmtDate(l.updatedAt) + '</option>';
    }).join('');

    return (
      '<div class="toolbar">' +
        '<select id="letterPicker" style="max-width:280px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:8px 10px; font-size:13px;">' + options + '</select>' +
        '<button class="btn" onclick="App.newLetter()">+ 새 편지</button>' +
        '<button class="btn danger" onclick="App.deleteLetter(\'' + letter.id + '\')">이 편지 삭제</button>' +
      '</div>' +
      '<div class="compose-grid">' +
        '<div class="form-col">' + formPanels(letter) + '</div>' +
        '<div class="preview-wrap">' +
          '<div class="preview-actions">' +
            '<button class="status-pill' + (letter.status==='ready'?' ready':'') + '" onclick="App.toggleStatus()">' +
              (letter.status==='ready' ? '✓ 발송 준비 완료' : '초안 — 클릭해서 준비완료로') +
            '</button>' +
            '<button class="btn primary" onclick="App.exportImage()">🖼 이미지로 저장</button>' +
            '<button class="btn" onclick="App.exportPDF()">📄 PDF로 저장</button>' +
            '<button class="btn" onclick="App.copyText()">📋 텍스트 복사</button>' +
          '</div>' +
          '<div class="paper-scroll"><div class="paper" id="paperNode"></div></div>' +
        '</div>' +
      '</div>'
    );
  }

  function formPanels(letter){
    var cover = letter.photos[0];
    var coverHtml = cover ? (
      '<div class="photo-row" data-pid="' + cover.id + '">' +
        '<img class="photo-thumb" src="' + cover.dataUrl + '" alt="표지 사진">' +
        '<div class="field" style="display:flex; align-items:center;">' +
          '<span style="font-size:12.5px; color:var(--ink-dim); font-weight:600;">표지 배경으로 쓰여요</span>' +
        '</div>' +
        '<button class="btn small danger" onclick="App.removePhoto(\'' + cover.id + '\')">삭제</button>' +
      '</div>'
    ) : (
      '<label class="upload-drop" style="display:block;">' +
        '📷 사진을 선택하거나 여기로 끌어다 놓으세요' +
        '<input type="file" id="photoInput" accept="image/*" style="display:none">' +
      '</label>'
    );

    var sectionsHtml = letter.sections.map(function(s){
      var sPhotos = s.photos || [];
      var sPhotosHtml = sPhotos.map(function(p){
        return (
          '<div class="sec-photo-thumb" data-pid="' + p.id + '">' +
            '<img src="' + p.dataUrl + '" alt="사진">' +
            '<button class="rm" onclick="App.removeSectionPhoto(\'' + s.id + '\',\'' + p.id + '\')" title="삭제">✕</button>' +
          '</div>'
        );
      }).join('');
      return (
        '<div class="section-block" data-sid="' + s.id + '">' +
          '<div class="section-block-head">' +
            '<input type="text" class="sec-heading" data-sid="' + s.id + '" value="' + esc(s.heading) + '" placeholder="소제목 (예: 감사 & 교회를 위해...)">' +
            '<button class="btn small danger" onclick="App.removeSection(\'' + s.id + '\')">삭제</button>' +
          '</div>' +
          '<textarea class="sec-body" data-sid="' + s.id + '" rows="4" placeholder="한 줄에 하나씩 기도제목을 적어주세요.&#10;예) 감사한 일 - 단기팀을 통해 복음을 전한 것">' + esc(s.body) + '</textarea>' +
          '<div class="sec-photos">' +
            sPhotosHtml +
            (sPhotos.length < 4 ?
              '<label class="sec-photo-add" title="이 항목에 사진 추가">' +
                '+ 사진' +
                '<input type="file" class="sec-photo-input" data-sid="' + s.id + '" accept="image/*" multiple style="display:none">' +
              '</label>' : '') +
          '</div>' +
        '</div>'
      );
    }).join('');

    return (
      '<div class="panel"><div class="panel-head"><h3>표지</h3><span class="hint">제목과 부제</span></div>' +
        '<div class="panel-body">' +
          '<div class="row2">' +
            '<div class="field"><label>부제</label><input type="text" id="f-subtitle" value="' + esc(letter.subtitle) + '" placeholder="Pray for Mongolia"></div>' +
            '<div class="field"><label>제목</label><input type="text" id="f-title" value="' + esc(letter.title) + '" placeholder="For His Glory"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><h3>표지 사진</h3><span class="hint">1장 · 안 올리면 기본 배경이 쓰여요</span></div>' +
        '<div class="panel-body">' +
          '<div class="photo-list">' + coverHtml + '</div>' +
        '</div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><h3>말씀 한 구절</h3><span class="hint">선택 사항</span></div>' +
        '<div class="panel-body">' +
          '<div class="field"><label>구절 참조</label><input type="text" id="f-verseRef" value="' + esc(letter.verseRef) + '" placeholder="예: 요한복음 21:25절"></div>' +
          '<div class="field"><label>구절 내용</label><textarea id="f-verseText" rows="2" placeholder="말씀 본문을 적어주세요">' + esc(letter.verseText) + '</textarea></div>' +
        '</div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><h3>여는 글</h3><span class="hint">자유롭게 적어주세요</span></div>' +
        '<div class="panel-body">' +
          '<div class="field"><textarea id="f-intro" rows="6" placeholder="이번 소식지를 열며 나누고 싶은 이야기를 적어주세요. 문단을 나누려면 빈 줄을 넣어주세요.">' + esc(letter.intro) + '</textarea></div>' +
        '</div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><h3>기도제목</h3><span class="hint">항목마다 사진을 따로 넣을 수 있어요</span></div>' +
        '<div class="panel-body">' +
          sectionsHtml +
          '<button class="btn" onclick="App.addSection()">+ 항목 추가</button>' +
        '</div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><h3>맺음말</h3><span class="hint">날짜 · 지역 · 이름</span></div>' +
        '<div class="panel-body">' +
          '<div class="field"><input type="text" id="f-footer" value="' + esc(letter.footerText) + '" placeholder="예: 2026년 9월, 몽골에서 김보선 이지혜 올림"></div>' +
        '</div>' +
      '</div>'
    );
  }

  function bindComposeEvents(){
    var letter = currentLetter();
    var picker = document.getElementById('letterPicker');
    if (picker) picker.addEventListener('change', function(){ state.currentId = picker.value; render(); });

    function bindField(id, key){
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function(){
        letter[key] = el.value;
        touch(letter);
        scheduleSave();
        renderPreview();
      });
    }
    bindField('f-title','title');
    bindField('f-subtitle','subtitle');
    bindField('f-verseRef','verseRef');
    bindField('f-verseText','verseText');
    bindField('f-intro','intro');
    bindField('f-footer','footerText');

    document.querySelectorAll('.sec-heading').forEach(function(inp){
      inp.addEventListener('input', function(){
        var s = letter.sections.find(function(s){ return s.id === inp.dataset.sid; });
        if (s){ s.heading = inp.value; touch(letter); scheduleSave(); renderPreview(); }
      });
    });
    document.querySelectorAll('.sec-body').forEach(function(ta){
      ta.addEventListener('input', function(){
        var s = letter.sections.find(function(s){ return s.id === ta.dataset.sid; });
        if (s){ s.body = ta.value; touch(letter); scheduleSave(); renderPreview(); }
      });
    });

    var photoInput = document.getElementById('photoInput');
    if (photoInput) photoInput.addEventListener('change', function(){ addPhotos(photoInput.files); });

    document.querySelectorAll('.sec-photo-input').forEach(function(inp){
      inp.addEventListener('change', function(){ addSectionPhotos(inp.dataset.sid, inp.files); });
    });

    renderSaveStatus();
  }

  var CARD_PALETTE = [
    { strong:'#ce9e27', soft:'#faf3e1' },
    { strong:'#96a630', soft:'#f1f5db' },
    { strong:'#5e9438', soft:'#e4f1da' }
  ];

  function renderPreview(){
    var letter = currentLetter();
    var node = document.getElementById('paperNode');
    if (!node) return;

    var photos = letter.photos || [];

    /* hero: first uploaded photo as full-bleed cover, or the default prayer-hands backdrop */
    var heroInner =
      '<div class="hero-inner">' +
        (letter.subtitle ? '<div class="hero-eyebrow">' + esc(letter.subtitle) + '</div>' : '') +
        '<div class="hero-title">' + esc(letter.title || '제목을 입력해주세요') + '</div>' +
      '</div>';
    var heroImgSrc = photos.length ? photos[0].dataUrl : DEFAULT_HERO_IMG;
    var heroHtml = '<div class="hero"><img src="' + heroImgSrc + '" alt="배경 사진"><div class="scrim"></div>' + heroInner + '</div>';

    var verseHtml = letter.verseText ? (
      '<div class="verse-card"><div class="icon">📖</div>' +
        (letter.verseRef ? '<div class="verse-ref">' + esc(letter.verseRef) + '</div>' : '') +
        '<div class="verse-text">&ldquo;' + esc(letter.verseText).replace(/\n/g,'<br>') + '&rdquo;</div>' +
      '</div>'
    ) : '';

    var introParas = (letter.intro||'').split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(Boolean)
      .map(function(p){ return '<p>' + esc(p).replace(/\n/g,'<br>') + '</p>'; }).join('');
    var introHtml = introParas ? '<div class="intro">' + introParas + '</div>' : '';

    var sIdx = 0;
    var sectionsHtml = letter.sections.map(function(s){
      var lines = (s.body||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      var sPhotos = s.photos || [];
      if (!s.heading.trim() && !lines.length && !sPhotos.length) return '';
      var c = CARD_PALETTE[sIdx % CARD_PALETTE.length];
      sIdx++;
      var itemsHtml = lines.map(function(l, i){
        return (
          '<div class="item">' +
            '<span class="num" style="background:' + c.strong + '">' + (i+1) + '</span>' +
            '<span class="txt">' + esc(l) + '</span>' +
          '</div>'
        );
      }).join('');
      var sCollageHtml = sPhotos.length
        ? '<div class="collage" style="margin-top:' + (lines.length ? '14px' : '2px') + '">' + sPhotos.map(function(p){ return '<img src="' + p.dataUrl + '" alt="사진">'; }).join('') + '</div>'
        : '';
      return (
        '<div class="section-card" style="background:' + c.soft + '">' +
          '<div class="badge" style="background:' + c.strong + '">ISSUE ' + (sIdx<10?'0':'') + sIdx + '</div>' +
          (s.heading.trim() ? '<h4>' + esc(s.heading) + '</h4>' : '') +
          (lines.length ? '<div class="items">' + itemsHtml + '</div>' : '') +
          sCollageHtml +
        '</div>'
      );
    }).join('');

    node.innerHTML =
      heroHtml +
      verseHtml +
      introHtml +
      sectionsHtml +
      (letter.footerText ? '<div class="footer">' + esc(letter.footerText) + '</div>' : '');
  }

  /* ---------- recipients ---------- */
  function recipientsTemplate(){
    var list = state.recipients.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ko'); });
    var rows = list.map(function(r){
      return (
        '<tr data-rid="' + r.id + '">' +
          '<td><button class="switch' + (r.active?' on':'') + '" data-act="toggle" title="발송 대상"></button></td>' +
          '<td><input type="text" class="r-name" value="' + esc(r.name) + '" placeholder="이름"></td>' +
          '<td><input type="text" class="r-memo" value="' + esc(r.memo) + '" placeholder="메모 (연락처, 관계 등)"></td>' +
          '<td><button class="btn small danger" data-act="del">삭제</button></td>' +
        '</tr>'
      );
    }).join('');

    return (
      '<div class="panel">' +
        '<div class="panel-head"><h3>수신자 목록</h3><span class="hint">기도편지를 보낼 분들을 관리해요 (카카오톡 등으로 직접 전달할 때 체크리스트로 활용돼요)</span></div>' +
        '<div class="panel-body">' +
          '<div class="toolbar">' +
            '<form class="add-recipient-form" id="addForm">' +
              '<input type="text" id="newName" placeholder="이름">' +
              '<input type="text" id="newMemo" placeholder="메모 (선택)">' +
              '<button class="btn primary" type="submit">+ 추가</button>' +
            '</form>' +
            '<span class="count">활성 ' + activeRecipients().length + '명 · 전체 ' + state.recipients.length + '명</span>' +
          '</div>' +
          (list.length ? (
            '<table class="rlist"><thead><tr><th>발송대상</th><th>이름</th><th>메모</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
          ) : (
            '<div class="empty-state"><div class="big">👥</div>기도편지를 보낼 분들을 추가해보세요.</div>'
          )) +
        '</div>' +
      '</div>'
    );
  }
  function bindRecipientsEvents(){
    var form = document.getElementById('addForm');
    if (form) form.addEventListener('submit', function(e){
      e.preventDefault();
      var nameEl = document.getElementById('newName'), memoEl = document.getElementById('newMemo');
      if (addRecipient(nameEl.value, memoEl.value)) renderRecipients();
    });
    document.querySelectorAll('table.rlist tr').forEach(function(tr){
      var rid = tr.dataset.rid;
      var toggleBtn = tr.querySelector('[data-act="toggle"]');
      if (toggleBtn) toggleBtn.addEventListener('click', function(){
        var r = state.recipients.find(function(r){ return r.id===rid; });
        updateRecipient(rid, { active: !r.active });
        renderRecipients();
      });
      var nameInp = tr.querySelector('.r-name');
      if (nameInp) nameInp.addEventListener('input', function(){ updateRecipient(rid, { name: nameInp.value }); });
      var memoInp = tr.querySelector('.r-memo');
      if (memoInp) memoInp.addEventListener('input', function(){ updateRecipient(rid, { memo: memoInp.value }); });
      var delBtn = tr.querySelector('[data-act="del"]');
      if (delBtn) delBtn.addEventListener('click', function(){ deleteRecipient(rid); });
    });
    renderSaveStatus();
  }
  function renderRecipients(){
    document.getElementById('viewRoot').innerHTML = recipientsTemplate();
    bindRecipientsEvents();
  }

  /* ---------- archive ---------- */
  function archiveTemplate(){
    if (state.archiveDetailId) return archiveDetailTemplate(state.archiveDetailId);

    var list = sortedLetters();
    var cards = list.map(function(l){
      var active = activeRecipients();
      var sentCount = active.filter(function(r){ return l.sentTo && l.sentTo[r.id]; }).length;
      return (
        '<div class="archive-card" data-lid="' + l.id + '">' +
          '<div class="ttl">' + esc(l.title || '(제목 없음)') + (l.isSample ? ' <span style="color:var(--ink-faint); font-weight:600;">· 예시</span>' : '') + '</div>' +
          '<div class="meta">' + fmtDate(l.updatedAt) + ' 수정 · 기도제목 ' + l.sections.length + '개</div>' +
          '<span class="badge' + (l.status==='ready'?' ready':'') + '">' + (l.status==='ready' ? '발송 준비 완료' : '초안') + '</span>' +
          (active.length ? '<div class="sendprog">발송 체크 ' + sentCount + ' / ' + active.length + '명</div>' : '') +
        '</div>'
      );
    }).join('');

    return (
      '<div class="panel"><div class="panel-head"><h3>보관함</h3><span class="hint">지금까지 작성한 기도편지</span></div>' +
        '<div class="panel-body">' +
          (list.length ? '<div class="archive-grid">' + cards + '</div>' : '<div class="empty-state"><div class="big">🗂</div>아직 작성한 편지가 없어요.</div>') +
        '</div>' +
      '</div>' +
      '<div class="footer-note">데이터는 이 브라우저에만 저장돼요 · <a id="backupExport">백업 내보내기</a> · <label style="cursor:pointer;" class="import-lbl">백업 가져오기<input type="file" id="backupImport" accept="application/json" style="display:none"></label></div>'
    );
  }
  function archiveDetailTemplate(id){
    var letter = getLetter(id);
    if (!letter) return '<div class="empty-state">편지를 찾을 수 없어요.</div>';
    var list = state.recipients.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ko'); });
    var rows = list.map(function(r){
      var sent = !!(letter.sentTo && letter.sentTo[r.id]);
      return (
        '<label class="check-row' + (sent?' sent':'') + (r.active?'':' ') + '" style="' + (r.active?'':'opacity:.45') + '">' +
          '<input type="checkbox" data-rid="' + r.id + '" ' + (sent?'checked':'') + '>' +
          '<span class="nm">' + esc(r.name) + (r.active?'':' (비활성)') + '</span>' +
          (r.memo ? '<span class="memo">' + esc(r.memo) + '</span>' : '') +
        '</label>'
      );
    }).join('');

    return (
      '<div class="detail-back"><button class="btn ghost" onclick="App.backToArchive()">← 보관함으로</button></div>' +
      '<div class="compose-grid">' +
        '<div class="panel"><div class="panel-head"><h3>' + esc(letter.title) + '</h3></div>' +
          '<div class="panel-body">' +
            '<div class="btn-row" style="margin-bottom:16px;">' +
              '<button class="btn primary" onclick="App.loadIntoCompose(\'' + letter.id + '\')">이 편지 불러와서 수정</button>' +
              '<button class="btn danger" onclick="App.deleteLetter(\'' + letter.id + '\')">삭제</button>' +
            '</div>' +
            '<h4 style="font-size:13px; color:var(--ink-dim); margin-bottom:8px;">발송 체크리스트</h4>' +
            (list.length ? '<div class="checklist" id="checklist">' + rows + '</div>' : '<div class="empty-state">수신자 관리 탭에서 먼저 수신자를 추가해주세요.</div>') +
          '</div>' +
        '</div>' +
        '<div class="preview-wrap"><div class="paper-scroll"><div class="paper" id="archivePaper"></div></div></div>' +
      '</div>'
    );
  }
  function bindArchiveEvents(){
    if (state.archiveDetailId){
      var letter = getLetter(state.archiveDetailId);
      var checklist = document.getElementById('checklist');
      if (checklist) checklist.querySelectorAll('input[type=checkbox]').forEach(function(cb){
        cb.addEventListener('change', function(){
          if (!letter.sentTo) letter.sentTo = {};
          letter.sentTo[cb.dataset.rid] = cb.checked;
          scheduleSave();
          cb.closest('.check-row').classList.toggle('sent', cb.checked);
        });
      });
      var savedId = state.currentId;
      state.currentId = letter.id;
      var node = document.getElementById('archivePaper');
      if (node){ node.id = 'paperNode'; renderPreview(); node.id = 'archivePaper'; }
      state.currentId = savedId;
      renderSaveStatus();
      return;
    }
    document.querySelectorAll('.archive-card').forEach(function(card){
      card.addEventListener('click', function(){ App.openArchiveDetail(card.dataset.lid); });
    });
    var exp = document.getElementById('backupExport');
    if (exp) exp.addEventListener('click', exportBackup);
    var imp = document.getElementById('backupImport');
    if (imp) imp.addEventListener('change', function(){ if (imp.files[0]) importBackup(imp.files[0]); });
    renderSaveStatus();
  }

  /* ---------------- go ---------------- */
  render();
  initBackendSync();
})();
</script>

</body>
</html>
